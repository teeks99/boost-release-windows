name: Build Boost Windows binaries

# One job per build configuration (toolset x architecture x variant x link),
# so no single job comes close to the six hour runner limit.  The matrix is
# generated from build.toml by `boostwin matrix`, which is the same code the
# local build uses, so CI and a hand-run build cannot drift apart.

on:
  # Uncomment either (or both) to build a specific commit automatically --
  # e.g. while iterating on this workflow itself.  Both build the whole
  # matrix and package it, same as a workflow_dispatch with default inputs.
  # Comment them back out again afterwards; workflow_dispatch is the only
  # trigger meant to stay on.
  push:
    branches: [master, distributed-builds]
  # pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Boost minor version, e.g. 93 (blank: use build.toml)"
        required: false
        default: ""
      minor_version:
        description: "Boost patch version, e.g. 0 (blank: use build.toml)"
        required: false
        default: ""
      type:
        description: "master-snapshot, beta-rc, beta, rc or release"
        required: false
        default: ""
      beta:
        description: "Beta number (only used by beta types)"
        required: false
        default: ""
      rc:
        description: "Release candidate number (only used by rc types)"
        required: false
        default: ""
      configs:
        description: "Exact configuration ids, comma separated (rebuild just these)"
        required: false
        default: ""
      toolsets:
        description: "Comma separated toolsets to build, e.g. 14.3,14.5"
        required: false
        default: ""
      archs:
        description: "Comma separated architectures to build, e.g. 64"
        required: false
        default: ""
      variants:
        description: "Comma separated variants to build: debug and/or release"
        required: false
        default: ""
      package:
        description: "Assemble the release archives when the builds finish"
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Empty values are ignored, so these can be forwarded unconditionally.
  BOOSTWIN_RELEASE_VERSION: ${{ inputs.version }}
  BOOSTWIN_RELEASE_MINOR_VERSION: ${{ inputs.minor_version }}
  BOOSTWIN_RELEASE_TYPE: ${{ inputs.type }}
  BOOSTWIN_RELEASE_BETA: ${{ inputs.beta }}
  BOOSTWIN_RELEASE_RC: ${{ inputs.rc }}

jobs:
  matrix:
    name: Work out the matrix
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.generate.outputs.configs }}
      count: ${{ steps.generate.outputs.count }}
      release_name: ${{ steps.generate.outputs.release_name }}
    steps:
      - uses: actions/checkout@v5

      # Cheap, and it catches a broken build.toml before 48 Windows runners
      # start up.
      - name: Run the tests
        run: python3 -m unittest discover -s tests -t . --quiet

      - name: Generate the build matrix
        id: generate
        env:
          CONFIGS: ${{ inputs.configs }}
          TOOLSETS: ${{ inputs.toolsets }}
          ARCHS: ${{ inputs.archs }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          # Empty means the whole matrix.
          filters=()
          add_filter() {
            local flag="$1"
            local values="$2"
            local item
            local IFS=','
            for item in $values; do
              [ -n "$item" ] && filters+=("$flag" "$item")
            done
          }
          add_filter --id "$CONFIGS"
          add_filter --toolset "$TOOLSETS"
          add_filter --arch "$ARCHS"
          add_filter --variant "$VARIANTS"

          python3 -m boostwin info
          python3 -m boostwin matrix --github "${filters[@]}"

  downloads:
    name: Fetch source and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the Boost source and the build dependencies
        run: python3 -m boostwin --build-root "$RUNNER_TEMP/boostwin" fetch

      # Shared with every build job, so the Boost and dependency servers see
      # one download per run rather than one per configuration.
      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: ${{ runner.temp }}/boostwin/downloads
          retention-days: 3
          compression-level: 0

  build:
    name: ${{ matrix.config.id }}
    needs: [matrix, downloads]
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix.outputs.configs) }}
    steps:
      - uses: actions/checkout@v5

      - name: Choose a build root
        shell: pwsh
        run: |
          $root = if (Test-Path 'D:\') { 'D:\boostwin' } else { 'C:\boostwin' }
          "BOOSTWIN_BUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "build root: $root"
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize

      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: ${{ env.BOOSTWIN_BUILD_ROOT }}\downloads

      # A couple of seconds, and it puts what is actually on the runner into
      # the log, which is the first thing you want when a toolset is not found.
      - name: Show the Visual Studio installations
        continue-on-error: true
        run: python -m boostwin toolchain --list

      - name: Prepare
        run: python -m boostwin prepare --no-fetch --id ${{ matrix.config.id }}

      - name: Build
        run: python -m boostwin build --id ${{ matrix.config.id }}

      - name: Smoke test
        run: python -m boostwin test --id ${{ matrix.config.id }}

      - name: Report free space
        if: always()
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-${{ matrix.config.id }}
          path: ${{ env.BOOSTWIN_BUILD_ROOT }}\stage\${{ matrix.config.id }}
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Assemble the release
    needs: [matrix, downloads, build]
    if: ${{ !cancelled() && needs.matrix.result == 'success'
        && (github.event_name != 'workflow_dispatch' || inputs.package) }}
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Choose a build root
        shell: pwsh
        run: |
          $root = if (Test-Path 'D:\') { 'D:\boostwin' } else { 'C:\boostwin' }
          "BOOSTWIN_BUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: ${{ env.BOOSTWIN_BUILD_ROOT }}\downloads

      - uses: actions/download-artifact@v4
        with:
          pattern: stage-*
          path: ${{ env.BOOSTWIN_BUILD_ROOT }}\stage

      - name: Package
        run: >
          python -m boostwin package --no-fetch --discard-stages

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.matrix.outputs.release_name }}-binaries
          path: ${{ env.BOOSTWIN_BUILD_ROOT }}\out
          retention-days: 30
          compression-level: 0
